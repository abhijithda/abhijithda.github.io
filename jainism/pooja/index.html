<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ಜೈನ ಪೂಜಾ ವಿಚಾರ ಸಂಕಲನ | Jaina Pooja Vichara Sankalana</title>
    <link rel="stylesheet" href="header/header.css">
    <link rel="stylesheet" href="core/media.css">
    <link rel="stylesheet" href="core/read-tracking.css">
    <link rel="stylesheet" href="core/card-types.css">
    <link rel="stylesheet" id="css-continuous" href="views/continuous/continuous-view.css">
    <link rel="stylesheet" id="css-book"       href="views/book/book-view.css">
</head>

<body>
    <header class="app-header">
        <div class="view-toggle">
            <button class="view-toggle-btn active" data-view="book" title="Book spread view">📖 Book</button>
            <button class="view-toggle-btn" data-view="continuous" title="Continuous scrolling view">☰ Continuous</button>
        </div>

        <input type="text" id="search-bar" placeholder="Search topics - ಅಭಿಷೇಕ, Daana...">

        <span id="read-progress" class="read-progress" title="Items you've marked as read"></span>

        <div class="view-menu-container">
            <button id="settings-btn" class="menu-trigger">Settings ⚙️</button>
            <div id="settings-menu" class="menu-content">
                <!-- Language: searchable multi-select, collapsed by default.
                     Was a single <select id="lang-select"> (All/kn/en); this scales
                     to a long language list without a wall of checkboxes. -->
                <div class="menu-section menu-section--lang">
                    <span class="menu-label">🌐 Language:</span>
                    <div class="lang-picker">
                        <button type="button" id="lang-trigger" class="lang-trigger" aria-expanded="false">
                            <span id="lang-summary" class="lang-summary"></span>
                            <span class="lang-chevron" aria-hidden="true">▾</span>
                        </button>
                        <div id="lang-panel" class="lang-panel" hidden>
                            <input type="text" id="lang-search" class="lang-search" placeholder="Search languages">
                            <div id="lang-list" class="lang-list">
                                <!-- built by header.js from KNOWN_LANGS -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="menu-section">
                    <label>🎬 Videos:</label>
                    <label class="switch">
                        <input type="checkbox" id="toggle-videos" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="menu-section">
                    <label>📱 QR Codes:</label>
                    <label class="switch">
                        <input type="checkbox" id="toggle-qrs">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="menu-section">
                    <label>✓ Read tracking:</label>
                    <label class="switch">
                        <input type="checkbox" id="toggle-read-tracking">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </header>

    <div id="continuous-container" style="display:none"></div>

    <div id="book-container" class="active"></div>

    <button id="back-to-message"
        style="display:none; position:fixed; bottom:25px; right:25px; background:#333; color:#fff; border:none; padding:12px 20px; border-radius:50px; cursor:pointer; z-index:1000; font-weight:bold;">
        ← Back to Message
    </button>

    <script type="module" src="app.js"></script>
</body>

</html>
