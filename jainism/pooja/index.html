<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Jaina Pooja FAQ</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="media.css">
    <link rel="stylesheet" href="read-tracking.css">
    <link rel="stylesheet" href="card-types.css">
    <link rel="stylesheet" id="css-continuous" href="continuous-view.css">
    <link rel="stylesheet" id="css-book" href="book-view.css">
</head>

<body>
    <header class="app-header">
        <!-- View toggle -->
        <div class="view-toggle">
            <button class="view-toggle-btn active" data-view="book">📖 Book</button>
            <button class="view-toggle-btn" data-view="continuous">☰ Continuous</button>
        </div>

        <!-- Search bar — always visible; in book view it searches across all pages -->
        <input type="text" id="search-bar" placeholder="Search topics - ಅಭಿಷೇಕ, Daana...">

        <!-- Read progress -->
        <span id="read-progress" class="read-progress" title="Items you've marked as read"></span>

        <!-- Settings — identical for both views -->
        <div class="view-menu-container">
            <button id="settings-btn" class="menu-trigger">Settings ⚙️</button>
            <div id="settings-menu" class="menu-content">

                <!-- Language: multi-checkbox picker (works for both views) -->
                <div class="menu-section menu-section--lang">
                    <span class="menu-label">🌐 Language:</span>
                    <div id="lang-checkboxes" class="lang-checkboxes">
                        <!-- built by header.js from KNOWN_LANGS -->
                    </div>
                </div>

                <div class="menu-divider"></div>

                <div class="menu-section">
                    <label>🎬 Videos:</label>
                    <label class="switch">
                        <input type="checkbox" id="toggle-videos" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="menu-section">
                    <label>📱 QR Codes:</label>
                    <label class="switch">
                        <input type="checkbox" id="toggle-qrs">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="menu-section">
                    <label>✓ Read tracking:</label>
                    <label class="switch">
                        <input type="checkbox" id="toggle-read-tracking">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </header>

    <!-- Continuous view -->
    <div id="continuous-container" style="display:flex"></div>

    <!-- Book view -->
    <div id="book-container"></div>

    <!-- Back-to-message (continuous view only) -->
    <button id="back-to-message" style="display:none; position:fixed; bottom:25px; right:25px; background:#333; color:#fff;
               border:none; padding:12px 20px; border-radius:50px; cursor:pointer; z-index:1000; font-weight:bold;">
        ← Back to Message
    </button>

    <!-- Print-only: all book pages rendered here for full-book printing -->
    <div id="book-print-container" class="book-print-container"></div>

    <script type="module" src="app.js"></script>
</body>

</html>
