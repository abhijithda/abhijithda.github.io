# ai/proxy/wrangler.toml — config for the Cloud engine proxy (worker.js).
# Deploy from this folder:  npx wrangler@4 deploy   (or the "Deploy AI proxy" workflow)
# The default backend is Cloudflare Workers AI: free, no API key, no card.

name = "pooja-ai-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"

# Keep Worker logs in the dashboard (Workers & Pages -> pooja-ai-proxy -> Logs), so a failure leaves a trace.
[observability]
enabled = true

# Workers AI (the free backend). Free plan: 10,000 "neurons" a day, after which Cloudflare itself refuses
# requests (no overage billing while the account stays on the Workers Free plan).
[ai]
binding = "AI"

[vars]
# Browsers send this as the Origin header (scheme + host + port, no path). Comma-separated.
# The 127.0.0.1 / localhost entries let you test Cloud from your own computer's dev server (port 3000);
# they add no real exposure: the Origin check is only a casual-misuse filter, and the limits below apply to everyone.
# A page on any other address (or port) is blocked by the browser with a "CORS" error, which is what you see
# when you test from an address that isn't listed here. Change the port if your dev server uses another one.
ALLOWED_ORIGINS = "https://abhijithda.github.io,http://127.0.0.1:3000,http://localhost:3000"

# 'workers-ai' (free, default) or 'anthropic' (paid; also needs the ANTHROPIC_API_KEY secret
# and MODEL = "claude-haiku-5-5", and the caps below raised to suit).
BACKEND = "workers-ai"
# Gemma 4 handles many languages and costs about 60 neurons per typical question (roughly 150 a day free).
# Cheaper alternative: "@cf/meta/llama-3.1-8b-instruct-fp8-fast" (about 35 neurons) but weaker beyond English.
MODEL = "@cf/google/gemma-4-26b-a4b-it"
# Gemma 4 thinks before answering unless told not to, and the thinking can eat the whole answer budget.
# Set to "false" if you switch MODEL to one that doesn't support this switch.
DISABLE_THINKING = "true"

# Exact daily caps, reset at 00:00 UTC. When one is hit the site shows "limit for today".
# These are set so that a worst-case day stays under 10,000 neurons with the model above:
#   700,000 input tokens x 9.091 + 60,000 output tokens x 27.273 per 1,000 = about 8,000 neurons.
# If you change MODEL, redo that sum with the neuron rates on Cloudflare's Workers AI pricing page.
DAILY_REQUEST_CAP = "150"          # questions per day, whole site
PER_IP_DAILY_CAP = "25"            # questions per day, per visitor
DAILY_INPUT_TOKEN_CAP = "700000"   # prompt tokens per day
DAILY_OUTPUT_TOKEN_CAP = "60000"   # answer tokens per day

# Per-minute rate limits. Cloudflare allows period = 10 or 60 only, and counts per location,
# approximately: a burst filter, not accounting (the Budget counter below does the exact part).
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "2001"
  [ratelimits.simple]
  limit = 5          # questions per minute, per visitor IP
  period = 60

[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "2002"
  [ratelimits.simple]
  limit = 40         # questions per minute, whole site
  period = 60

# Exact daily counters (class Budget in worker.js).
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Budget"]
