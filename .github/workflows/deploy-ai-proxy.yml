# Manual: deploys the Cloud-engine proxy (ai/proxy/) to Cloudflare Workers.
# The site itself is NOT deployed by this (GitHub Pages serves it straight from the repo).
#
# WHERE THIS FILE LIVES: GitHub only reads workflows from the REPO ROOT, i.e.
#   abhijithda.github.io/.github/workflows/deploy-ai-proxy.yml
# (not from jainism/pooja/.github/, which GitHub ignores).
#
# PROXY_DIR below is where the proxy is inside the repo. Change it if the project moves.
#
# One-time setup, repo Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   token created from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the Workers & Pages overview page
#   ANTHROPIC_API_KEY      key created INSIDE a workspace that has a spend limit (ai/proxy/README.md)
name: Deploy AI proxy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROXY_DIR: jainism/pooja/ai/proxy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the proxy folder and the three secrets exist
        run: |
          if [ ! -f "$PROXY_DIR/wrangler.toml" ]; then
            echo "::error::No wrangler.toml in '$PROXY_DIR'. Is the proxy committed and pushed, and is PROXY_DIR right? Folders at the top of the repo:"
            ls -1
            exit 1
          fi
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing repo secret $v"; exit 1; }
          done
          [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ] || { echo "::error::Missing repo secret ANTHROPIC_API_KEY"; exit 1; }
      - name: Deploy the Worker (creates it on first run)
        working-directory: ${{ env.PROXY_DIR }}
        run: npx --yes wrangler@4 deploy
      - name: Set the API key (stored by Cloudflare, never in the repo or the site)
        working-directory: ${{ env.PROXY_DIR }}
        run: printf '%s' "${{ secrets.ANTHROPIC_API_KEY }}" | npx --yes wrangler@4 secret put ANTHROPIC_API_KEY
