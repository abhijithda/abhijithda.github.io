name: Publish Pooja Prints

# Manual only — never runs on push/PR, and never commits anything. Trigger it
# from the Actions tab ("Run workflow"), pick the branch and a delivery mode:
#   artifact — renders the print PDFs and uploads them as a downloadable zip
#              for you to review first (kept 90 days, GitHub's max for public
#              repos); nothing is published
#   release  — same, and also attaches the PDFs to a new GitHub Release
#              (no expiry), ready to share
# Always renders the repo's real data.json; test data is never rendered or
# published. Output is six PDFs, named like
#   Jaina-Pooja-Vichara-Sankalana-Book-A4-2026-10-10.pdf
#   Continuous-A4 / Continuous-A3  whole-page layout, for reading
#   Book-A4 / Book-A3              one numbered book page per PDF page
#                                  (A4 sheet = A5 pages, A3 sheet = A4 pages)
#   Booklet-A4 / Booklet-A3        the Book pages arranged on sheets in booklet
#                                  order: print double-sided, flip on short
#                                  edge, actual size, then fold (PRINTING.md)
# The booklets are made by scripts/render-prints.js itself (via
# scripts/impose-booklet.js, which needs pdf-lib from package.json), so there
# is nothing extra to run here; the check step below just fails the run if any
# of the six is missing.
#
# The release job is separate so only it gets write access (it creates the
# release and its tag, prints-<date>-<run#>, on the branch's current commit);
# the render job stays read-only. Nothing is committed or pushed to a branch.
# Separate from update-snapshots.yml on purpose: that one regenerates test
# baselines (and can push).
on:
  workflow_dispatch:
    inputs:
      delivery:
        description: 'How to deliver the prints'
        required: true
        type: choice
        default: artifact
        options:
          - artifact
          - release

permissions:
  contents: read

jobs:
  render-prints:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      date: ${{ steps.meta.outputs.date }}

    defaults:
      run:
        working-directory: ./jainism/pooja

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🏷️ Name this build
      id: meta
      working-directory: .
      run: |
        echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
        echo "artifact_name=pooja-prints-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './jainism/pooja/package-lock.json'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🌐 Install Playwright Browsers & OS Dependencies
      run: npx playwright install --with-deps

    - name: 🖨️ Render print PDFs (continuous, book, and booklet)
      run: node scripts/render-prints.js

    - name: ✅ Check all six PDFs were produced
      run: |
        missing=0
        for kind in Continuous Book Booklet; do
          for size in A4 A3; do
            if ! ls prints/*-"${kind}"-"${size}"-*.pdf >/dev/null 2>&1; then
              echo "::error::Missing ${kind} ${size} PDF in prints/"
              missing=1
            fi
          done
        done
        ls -l prints/
        exit $missing

    - name: 📦 Upload prints for review
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.meta.outputs.artifact_name }}
        path: jainism/pooja/prints/
        retention-days: 90   # GitHub's max for public repos
        if-no-files-found: error

  publish-release:
    if: inputs.delivery == 'release'
    needs: render-prints
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only this job can write to the repo (to create the release + tag).
    permissions:
      contents: write

    steps:
    - name: 📥 Download rendered prints
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.render-prints.outputs.artifact_name }}
        path: prints

    - name: 🏷️ Create release with the prints attached
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        DATE="${{ needs.render-prints.outputs.date }}"
        gh release create "prints-${DATE}-${{ github.run_number }}" prints/*.pdf \
          --repo "${{ github.repository }}" \
          --target "${{ github.sha }}" \
          --title "Jaina Pooja Vichara Sankalana — Prints (${DATE})" \
          --notes "Generated on ${DATE}. In every file name, A4 / A3 is the sheet of paper you print on.

        **Booklet-A4 / Booklet-A3: print these to make a folded book.** Print double-sided, flip on SHORT edge, actual size (100%, not fit-to-page), then fold the stack in half (Booklet-A4 gives an A5 book, Booklet-A3 an A4 book). Longer books are split into 16-page signatures to fold and sew separately.

        **Book-A4 / Book-A3:** one numbered book page per PDF page, for reading on screen or for your printer's own booklet mode.

        **Continuous-A4 / Continuous-A3:** whole-page layout for reading or loose pages (not for binding)."